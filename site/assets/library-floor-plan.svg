<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
<title id="title">Teaching schematic of a library ground floor</title>
<desc id="description">The reading room is to the left of reception. The lift is across the corridor from reception. This is a fictional teaching layout, not a map of real premises.</desc>
<rect width="640" height="360" rx="12" fill="#f5f7fa"/>
<g font-family="sans-serif" fill="#162638">
<text x="24" y="34" font-size="20" font-weight="700">Library ground floor: teaching schematic</text>
<rect x="350" y="58" width="264" height="82" rx="6" fill="#d8e8f4" stroke="#244b6c" stroke-width="2"/>
<text x="482" y="106" text-anchor="middle" font-size="24">Lift</text>
<path d="M24 160H616 M24 220H616" stroke="#53677a" stroke-width="2"/>
<text x="320" y="197" text-anchor="middle" font-size="22">Corridor</text>
<rect x="26" y="240" width="264" height="82" rx="6" fill="#d9eadc" stroke="#28553a" stroke-width="2"/>
<text x="158" y="288" text-anchor="middle" font-size="24">Reading room</text>
<rect x="350" y="240" width="264" height="82" rx="6" fill="#fae8ce" stroke="#705127" stroke-width="2"/>
<text x="482" y="288" text-anchor="middle" font-size="24">Reception</text>
<text x="24" y="347" font-size="14">Not to scale. Not directions to real premises.</text>
</g></svg>

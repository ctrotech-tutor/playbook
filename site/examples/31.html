<!doctype html>
<html lang="en">
<head><meta name="author" content="Odejobi Abiola Samuel">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image maps: example</title>

</head>
<body>
<h1>Image maps: example</h1>
<img src="../assets/library-floor-plan.svg"
     alt="Teaching plan: reading room left of reception, lift opposite"
     usemap="#facilities" width="640" height="360">
<map name="facilities" id="facilities">
  <area shape="rect" coords="26,240,290,322" href="#reading-room"
        alt="Reading room details">
</map>
<p><a href="#reading-room">Reading room details</a></p>
<section id="reading-room">
  <h2>Reading room</h2>
  <p>This fictional schematic places the reading room left of reception.</p>
</section>
</body>
</html>

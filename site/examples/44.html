<!doctype html>
<html lang="en">
<head><meta name="author" content="Odejobi Abiola Samuel">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dialogs and popovers: example</title>

</head>
<body>
<h1>Dialogs and popovers: example</h1>
<button type="button" id="open-help">Membership help</button>
<dialog id="help-dialog" aria-labelledby="help-title">
  <h2 id="help-title">Membership help</h2>
  <p>Ask at the desk if you cannot supply an address document.</p>
  <form method="dialog"><button>Close help</button></form>
</dialog>
<script>
  const help = document.getElementById("help-dialog");
  document.getElementById("open-help").addEventListener("click", () => {
    help.showModal();
  });
</script>
</body>
</html>

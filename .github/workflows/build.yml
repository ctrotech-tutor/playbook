name: Build and integrity checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DEPLOY_ENV: production
      SEO_TEST_MODE: '1'
      SITE_URL: https://ci.example.test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check content integrity and hosting changes
        run: npm test
      - name: Build production output with a synthetic test origin
        run: npm run build
      - name: Verify generated documents and metadata
        run: npm run check:site
      - name: Ensure build leaves tracked source unchanged
        run: git diff --exit-code
